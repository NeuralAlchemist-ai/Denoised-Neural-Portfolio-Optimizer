# Portfolio optimization configuration for DenoisedPortfolioWrapper
# weights_option: portfolio construction mode
#   - "long-only"    — softmax weights, all positive, sum to 1
#   - "long-short"   — long/short positions, gross exposure = L
#   - "neutral-only" — market-neutral, zero net exposure
weights_option: "long-only"

# Risk-aversion coefficient: higher gamma → lower risk, lower returns
gamma: 1.0

# Ridge regularisation added to the covariance matrix for numerical stability
ridge: 1.0e-2

# Temperature for the softmax in weight construction; lower t → more concentrated
t: 1.0

# Maximum weight cap per asset (as a fraction of L)
w_max: 0.15

# Gross leverage / total exposure target (sum of |weights| = L)
L: 1.0

# Numerical epsilon to avoid division by zero
eps: 1.0e-8

features_path: "data/processed/features_tensor.pt"
prices_path: "data/raw/prices.parquet"
save_dir: "models_weights"
log_dir: "logs"
test_size: 0.2
validation_size: 0.2

epochs: 100
batch_size: 32
alpha: 0.7
lr: 1.0e-3

# Covariance estimation configuration from portfolio.covariance.estimators
cov_estimator: "sample" # options: "sample", "ledoit_wolf", "ewma"
denoise: true                # apply Marchenko-Pastur spectral denoising
lookback_days: 252           # rolling window in trading days
half_life: 63                # used if cov_estimator is "ewma"

# Learning rate scheduler configuration
scheduler:
  type: "ReduceLROnPlateau" # options: "ReduceLROnPlateau", "CosineAnnealingLR", "StepLR"
  factor: 0.5
  patience: 8
  min_lr: 1.0e-5

# Time-series walk-forward cross-validation
cross_validation:
  enabled: true
  n_splits: 5
  cv_epochs: 40

# Backbones to train / cross-validate
backbones:
  - "DeepMarkowitz_MLP"
  - "DeepMarkowitz_MHA"
  - "DeepMarkowitz_MLA"
